[package]
name = "thumbcache_viewer"
version = "1.0.0"
edition = "2021"
description = "Thumbcache Viewer - extract thumbnail images from thumbcache database files"
license = "GPL-3.0-or-later"
build = "build.rs"

[[bin]]
name = "thumbcache_viewer"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
